name: Update Cricket Fixtures

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update-fixtures:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch historical and upcoming cricket matches
        env:
          BIGBALLSDATA_API_KEY: ${{ secrets.BIGBALLSDATA_API_KEY }}
        run: |
          node <<'NODE'
          const fs = require("fs");

          async function main() {
            const key = process.env.BIGBALLSDATA_API_KEY;

            if (!key) {
              throw new Error(
                "BIGBALLSDATA_API_KEY secret is missing"
              );
            }

            const today = new Date();

            const start = new Date(today);
            start.setUTCDate(start.getUTCDate() - 90);

            const end = new Date(today);
            end.setUTCDate(end.getUTCDate() + 7);

            const fmt = (date) =>
              date.toISOString().slice(0, 10);

            const url =
              "https://api.bigballsdata.com/v1/cricket/matches" +
              `?date=${fmt(start)}:${fmt(end)}&limit=200`;

            console.log(
              `Requesting matches from ${fmt(start)} to ${fmt(end)}`
            );

            const response = await fetch(url, {
              headers: {
                Authorization: `Bearer ${key}`
              }
            });

            const text = await response.text();

            if (!response.ok) {
              throw new Error(
                `BigBallsData HTTP ${response.status}: ` +
                text.slice(0, 300)
              );
            }

            const json = JSON.parse(text);

            if (!Array.isArray(json.data)) {
              throw new Error(
                "API response did not contain a data array"
              );
            }

            fs.writeFileSync(
              "matches.json",
              JSON.stringify(json, null, 2) + "\n"
            );

            const completed = json.data.filter(
              match =>
                ["completed", "complete", "finished"]
                  .includes(
                    String(match.status || "").toLowerCase()
                  )
            );

            console.log(
              `Saved ${json.data.length} matches; ` +
              `${completed.length} appear completed by status.`
            );

            if (json.data.length >= 200) {
              console.log(
                "Notice: API returned 200 matches. " +
                "The date range may contain additional matches."
              );
            }
          }

          main().catch(error => {
            console.error(error.message);
            process.exit(1);
          });
          NODE

      - name: Commit updated fixtures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add matches.json
          git diff --cached --quiet || git commit -m "Update historical and upcoming cricket matches"
          git push
