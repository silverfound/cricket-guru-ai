name: Build competition-specific Cricsheet statistics
on:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * 1"
permissions:
  contents: write
jobs:
  build-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and process Cricsheet archive
        run: |
          python - <<'PY'
          import io,json,os,re,urllib.request,zipfile
          from collections import defaultdict
          req=urllib.request.Request('https://cricsheet.org/downloads/all_json.zip',headers={'User-Agent':'CricketGuruAI/1.0'})
          with urllib.request.urlopen(req,timeout=240) as r: data=r.read()
          def norm(x): return re.sub(r'[^a-z0-9]','',str(x or '').lower())
          def fmt(x):
            x=str(x or '').upper()
            if x in ('ODI','ODM','WODI','WODM'): return 'ODI'
            if x in ('IT20',): return 'T20I'
            if x in ('T20','WT20'): return 'T20'
            if x in ('TEST','MDM','WTEST'): return 'Test'
            return 'Other'
          def league(x):
            n=norm(x); rules=[('wbbl','wbbl'),('womensbigbash','wbbl'),('bbl','bbl'),('bigbash','bbl'),('indianpremierleague','ipl'),('ipl','ipl'),('pakistansuperleague','psl'),('psl','psl'),('womenscpl','wcpl'),('wcpl','wcpl'),('caribbeanpremierleague','cpl'),('cpl','cpl'),('ilt20','ilt20'),('majorleaguecricket','majorleaguecricket'),('mlc','majorleaguecricket'),('sa20','sa20'),('bangladeshpremierleague','bpl'),('bpl','bpl'),('lankapremierleague','lankapremierleague'),('lpl','lankapremierleague'),('wpl','wpl'),('thehundred','thehundred'),('hundred','thehundred')]
            for token,key in rules:
              if token in n:return key
            return 'other'
          def blank(): return {'matches':0,'wins':0,'losses':0,'draws':0,'no_results':0,'runs_scored':0,'innings_batted':0,'wickets_lost':0,'runs_conceded':0,'innings_bowled':0,'recent_results':[]}
          formats=defaultdict(lambda:defaultdict(blank)); comps=defaultdict(lambda:defaultdict(blank)); read=0
          with zipfile.ZipFile(io.BytesIO(data)) as z:
            for fn in z.namelist():
              if not fn.lower().endswith('.json') or '/' in fn.strip('/'): continue
              try:
                with z.open(fn) as f:m=json.load(f)
                info=m.get('info',{});teams=info.get('teams',[])
                if len(teams)!=2:continue
                fkey=fmt(info.get('match_type'));ev=(info.get('event') or {}).get('name','');ckey=league(ev);tot=defaultdict(lambda:{'runs':0,'wickets':0})
                for inn in m.get('innings',[]):
                  t=inn.get('team')
                  if t not in teams:continue
                  for over in inn.get('overs',[]):
                    for d in over.get('deliveries',[]):
                      tot[t]['runs']+=int(d.get('runs',{}).get('total',0));tot[t]['wickets']+=len(d.get('wickets',[]))
                if not tot:continue
                read+=1;winner=info.get('outcome',{}).get('winner');otype=str(info.get('outcome',{}).get('result','')).lower();date=(info.get('dates') or [''])[0]
                for t in teams:
                  opp=next(x for x in teams if x!=t);targets=[formats[fkey][t]]
                  if fkey=='T20':targets.append(comps[ckey][t])
                  for s in targets:
                    s['matches']+=1;s['runs_scored']+=tot[t]['runs'];s['innings_batted']+=1;s['wickets_lost']+=tot[t]['wickets'];s['runs_conceded']+=tot[opp]['runs'];s['innings_bowled']+=1
                    if winner==t:res='win';s['wins']+=1
                    elif winner in teams:res='loss';s['losses']+=1
                    elif otype=='draw':res='draw';s['draws']+=1
                    else:res='no_result';s['no_results']+=1
                    s['recent_results'].append({'date':date,'opponent':opp,'result':res,'runs':tot[t]['runs'],'opponent_runs':tot[opp]['runs'],'competition':ev})
              except Exception as e: print('Skipped',fn,e)
          def pack(d):
            out={}
            for team,s in d.items():s['recent_results'].sort(key=lambda x:x['date']);s['recent_results']=s['recent_results'][-10:];out[team]=s
            return out
          out={'source':'Cricsheet','source_url':'https://cricsheet.org/downloads/','matches_read':read,'formats':{},'competitions':{}}
          for k,v in formats.items():out['formats'][k]={'teams':pack(v)}
          for k,v in comps.items():out['competitions'][k]={'teams':pack(v)}
          os.makedirs('data',exist_ok=True)
          with open('data/cricsheet-team-stats.json','w',encoding='utf-8') as f:json.dump(out,f,ensure_ascii=False,separators=(',',':'))
          print('Processed matches:',read,'; competitions:',{k:len(v) for k,v in comps.items()})
          PY
      - name: Commit generated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cricsheet-team-stats.json
          git diff --cached --quiet || git commit -m "Build competition-specific Cricsheet statistics"
          git push
          
